server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build artifacts. These must 404 when absent rather than fall through to the
    # SPA fallback below.
    #
    # `try_files $uri $uri/ /index.html` answers a request for a stylesheet that no longer
    # exists with index.html — 200 OK, Content-Type: text/html. The browser then discards
    # the "stylesheet", the app renders with no styling at all, and every request in the
    # network tab still reads 200, so there is no error to follow. That is exactly what a
    # client holding an index.html from an earlier build does, and it is indistinguishable
    # from a broken build. A 404 makes the stale asset fail where it can be seen.
    location /assets/ {
        try_files $uri =404;
        # Filenames carry a content hash, so a given URL's bytes never change.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The one file whose URL does not change between builds, and therefore the one that
    # must be revalidated: a cached copy is what points at asset filenames that may be gone.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
